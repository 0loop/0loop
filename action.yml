name: 0loop
description: 'Turn a GitHub Actions run into an AI agent: write a prompt, it reads code, runs commands, and writes results back.'
branding:
  icon: terminal
  color: blue
inputs:
  prompt:
    description: Natural-language description of what this run should accomplish. Event context is appended automatically.
    required: true
  tools:
    description: Additional tools, array form.
  skills:
    description: Skills, array form. github.com/<owner>/<repo> installs a remote skill repo via skills.sh; . enables this repo's .agents/skills/ directory.
  mcp:
    description: MCP server launch commands, array form. Credentials reference $VAR slots, resolved from env.
runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14
    - name: Run 0loop
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH"
        bun install --frozen-lockfile
        bun run build
        ./dist/0loop
      env:
        ZEROLOOP_PROMPT: ${{ inputs.prompt }}
        ZEROLOOP_TOOLS: ${{ inputs.tools }}
        ZEROLOOP_SKILLS: ${{ inputs.skills }}
        ZEROLOOP_MCP: ${{ inputs.mcp }}
        ZEROLOOP_PROTOCOL: ${{ env.ZEROLOOP_PROTOCOL }}
        ZEROLOOP_MODEL: ${{ env.ZEROLOOP_MODEL }}
        ZEROLOOP_API_KEY: ${{ env.ZEROLOOP_API_KEY }}
        ZEROLOOP_BASE_URL: ${{ env.ZEROLOOP_BASE_URL }}
