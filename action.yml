name: 0loop
description: 'Turn a GitHub Actions run into an AI agent: write a prompt, it reads code, runs commands, and writes results back.'
branding:
  icon: terminal
  color: blue
inputs:
  agent:
    description: YAML object defining the agent. Keys are protocol, model, effort, meta, runtime, prompt or prompt-file, mcp, and skills. Event context is appended to the prompt automatically.
    required: true
  permissions:
    description: YAML object bounding the run. Keys are tools (read or write, default read), network (allowed hosts), and allow-users (GitHub usernames that may start the run).
runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14
    - name: Run 0loop
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH"
        bun install --frozen-lockfile
        bun run build
        ./dist/0loop
      env:
        ZEROLOOP_AGENT: ${{ inputs.agent }}
        ZEROLOOP_PERMISSIONS: ${{ inputs.permissions }}
