name: Issue
description: Report a bug or raise a question about 0loop
body:
  - type: dropdown
    id: kind
    attributes:
      label: Type
      description: What kind of issue is this?
      options:
        - Bug
        - Question
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, or what is the question? For bugs, include what you expected and what you got.
      placeholder: A clear, concise description.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: For bugs, the minimal steps to reproduce.
      placeholder: |
        1. In this environment...
        2. With this config...
        3. Run '...'
        4. See error...
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Bun version, runner context (if relevant).
      placeholder: macOS 15, Bun 1.3.14
    validations:
      required: false
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      description: How much does this affect users or development?
      options:
        - Low
        - Medium
        - High
    validations:
      required: true
