name: 0loop assistant

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: assistant-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  pull_request_review:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          persist-credentials: false
          fetch-depth: 0
          allow-unsafe-pr-checkout: true

      - name: Run Codex review
        id: codex
        uses: openai/codex-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          openai-api-key: ${{ secrets.CODEX_API_KEY }}
          responses-api-endpoint: ${{ vars.CODEX_BASE_URL }}
          model: ${{ vars.CODEX_MODEL }}
          allow-users: minorcell
          sandbox: danger-full-access
          safety-strategy: unsafe
          prompt: |
            You are 0loop, a code reviewer for this repository.

            Review the pull request titled: ${{ github.event.pull_request.title }}

            PR description:
            ${{ github.event.pull_request.body }}

            Compare the pull request changes against the base branch.

            Rules:
            - Focus on the diff. Do not review files outside the changed set.
            - Flag correctness bugs, missing tests for changed behavior, and regressions against CONTRIBUTING.md and CLAUDE.md.
            - If a change references an issue, verify the change addresses it.
            - Be specific. Name files and line ranges. Do not restate code.
            - If the diff is clean, say APPROVED.
            - If changes are needed, say CHANGES REQUESTED and list what must change before merge.
            - Use the GH_TOKEN environment variable to publish one GitHub pull request review through the Reviews API.
            - Submit the review with `event: COMMENT`, a concise summary in `body`, and actionable inline comments in `comments[]` using each changed file's `path`, diff `line`, and `side: RIGHT`.
            - Obtain the changed-file patches with `gh api repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files`; do not invent line numbers.
            - If there are no actionable findings, submit a COMMENT review with `APPROVED` in the body and an empty comments array.
            - Do not use `gh pr comment`, `gh pr review --approve`, or `gh pr review --request-changes`.
            - Do not create commits, branches, or pull requests.

            Finish with exactly one of:
            APPROVED
            CHANGES REQUESTED
