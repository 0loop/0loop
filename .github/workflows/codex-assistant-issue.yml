name: 0loop issue reply

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  reply:
    if: |
      github.event.issue.pull_request == null
      && github.event.comment.user.login != github.repository_owner
      && (
        contains(github.event.comment.body, '@0loop')
        || contains(github.event.comment.body, '/0loop')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Codex CLI
        run: bun add --global @openai/codex@latest

      - name: Gather issue context
        id: ctx
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/issue-context.md"
          {
            echo "# Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}"
            echo
            echo "## Body"
            echo
            echo "${{ github.event.issue.body }}"
            echo
            echo "## Comment that triggered this run"
            echo
            echo "${{ github.event.comment.body }}"
            echo
            echo "## Related comments"
            echo
          } > "$out"
          gh issue view "${{ github.event.issue.number }}" --comments --json comments --jq '.comments[] | "### \( .user.login )\n\n\( .body )\n"' >> "$out" 2>/dev/null || true
          echo "FILE=$out" >> "$GITHUB_STEP_SUMMARY"

      - name: Run Codex
        env:
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          CODEX_BASE_URL: ${{ vars.CODEX_BASE_URL }}
          CODEX_MODEL: ${{ vars.CODEX_MODEL }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CODEX_API_KEY:-}" ]]; then
            echo "::error::Repository secret CODEX_API_KEY is not configured."
            exit 1
          fi

          codex_args=(
            --ask-for-approval never
            --config 'model_provider="ci"'
            --config 'model_providers.ci.name="CI provider"'
            --config 'model_providers.ci.base_url="${CODEX_BASE_URL}"'
            --config 'model_providers.ci.env_key="CODEX_API_KEY"'
            --config 'model_providers.ci.wire_api="responses"'
            --config 'model_providers.ci.supports_websockets=false'
          )
          if [[ -n "${CODEX_MODEL:-}" ]]; then
            codex_args+=(--model "$CODEX_MODEL")
          fi

          prompt="You are 0loop, a project assistant for this repository.

          A human commented on issue #${{ github.event.issue.number }} and asked you to respond.
          Read the full issue and comments, understand what the human is asking, and reply directly.

          Rules:
          - Speak in the same language the human used (Chinese or English).
          - Answer the actual question. If you need to inspect code, look at the checked-out repository.
          - Do not create commits, branches, or files. This run only writes a comment to the issue.
          - Keep the reply short enough for a comment; if the answer needs a design doc or proposal, outline it and say a separate issue would be the proper home.
          - If the request is a feature proposal, summarize: background, goals, approach, scope. Do not open the issue yourself; the human does that.
          - If the request is a question, answer it.
          - Finish your reply with no trailing 'APPROVED' or 'CHANGES REQUESTED'."

          CODEX_API_KEY="$CODEX_API_KEY" codex "${codex_args[@]}" exec \
            --ignore-user-config \
            --ephemeral \
            --sandbox danger-full-access \
            --output-last-message "$RUNNER_TEMP/codex-reply.md" \
            "$prompt"

      - name: Post reply to issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          body_file="$RUNNER_TEMP/codex-reply.md"
          if [[ ! -s "$body_file" ]]; then
            echo "::error::Codex did not produce a reply. Check the previous step log."
            exit 1
          fi

          gh issue comment "${{ github.event.issue.number }}" --body-file "$body_file"
