name: issue-gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  issue-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Require an issue reference
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const refs = [...body.matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/gi)]
              .map((m) => parseInt(m[1], 10));

            if (refs.length === 0) {
              core.setFailed(
                'PR body must reference an issue with a closing keyword (fixes #N / closes #N). See CONTRIBUTING.md.',
              );
              return;
            }

            core.info(
              `Found issue reference(s): ${[...new Set(refs)].map((n) => '#' + n).join(', ')}.`,
            );
