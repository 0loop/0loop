name: issue-gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  issues: read
  pull-requests: read

jobs:
  issue-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Require an accepted issue
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const refs = [...body.matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/gi)]
              .map((m) => parseInt(m[1], 10));

            if (refs.length === 0) {
              core.setFailed(
                'PR body must reference an issue with a closing keyword (fixes #N / closes #N). See CONTRIBUTING.md.',
              );
              return;
            }

            for (const issueNumber of [...new Set(refs)]) {
              try {
                const { data: issue } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                });
                if (issue.labels.some((l) => l.name === 'accepted')) {
                  core.info(`Issue #${issueNumber} carries the accepted label — gate passed.`);
                  return;
                }
              } catch (error) {
                core.warning(`Could not read issue #${issueNumber}: ${error.message}`);
              }
            }

            core.setFailed(
              `None of the referenced issues (${[...new Set(refs)].map((n) => '#' + n).join(', ')}) carries the accepted label. ` +
                'Open an issue and wait for the maintainer to accept it before opening a pull request.',
            );
