name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by trailers
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          for commit in $(git rev-list --no-merges origin/main..HEAD); do
            author="$(git show -s --format='%an <%ae>' "$commit")"
            if ! git show -s --format='%B' "$commit" | grep -Fq "Signed-off-by: $author"; then
              echo "::error::commit $commit is missing a Signed-off-by trailer matching its author ($author). Fix with: git commit --amend --no-edit --signoff"
              exit 1
            fi
          done
